# ── Router connection ──────────────────────────────────────────────
router_host: 192.168.88.1          # your MikroTik's IP (set to yours)
router_port: 8728                  # 8728 plain API, 8729 for API-SSL
router_user: domainblock           # the API user you created
router_pass: CHANGE_ME             # required — no default
router_tls: false                  # true if using api-ssl on 8729

# ── Address lists ──────────────────────────────────────────────────
check_list: domainblock-check      # queue list the firewall rules populate
banned_list: domainblock-banned    # list the drop rules block

# ── Ban behaviour ──────────────────────────────────────────────────
ban_timeout: 10d                   # how long a ban lasts; default 10 days
dns_timeout: 3                     # seconds per reverse-DNS / ASN lookup

# ── ASN / datacenter check (second signal, alongside PTR patterns) ───
# Only consulted for a candidate that PTR matching didn't already ban (no
# PTR at all, or a PTR that didn't match anything). Looked up via Team
# Cymru's whois-over-DNS service, no gem, no local database. See
# domainblock-asn-patterns.txt and the README section on this feature.
asn_check: false                  # true = also check ASN name patterns

# ── Watched-ports auto-management (forward queue rule dst-port sync) ─
watched_ports_manage: true         # false = leave the forward rule alone
exclude_ports: []                  # force-exclude ports even if a tagged
                                   # NAT rule has them, e.g. [8124]

# ── Ban-cache persistence (survive router reboots + script restarts) ─
ban_cache: true                    # false = disable the cache entirely
ban_cache_file: ban-cache.txt      # relative to the script dir (/opt/...)
ban_cache_every: 60                # refresh every N runs; 60 @30s = 30 min
ban_cache_counter: /tmp/domainblock-run-counter   # cleared on Linux reboot

# ── Monthly pattern-coverage report (mechanical, emailed) ────────────
# Diffs each month's rotated seen.csv against your current pattern files and
# emails only what's NOT already covered, ranked by hit volume. This is a
# mechanical coverage report, not a verdict -- deciding whether something is
# safe to add still takes an actual look. Requires seen_log: true above and
# the logrotate drop-in (see install.sh) so there's a rotated archive to read.
monthly_report: false              # true = enable the monthly report
report_subject: "domainblock monthly report - %{month}"   # used for the email
                                    # Subject and the report's own opening line;
                                    # %{month} is replaced with e.g. 2026-08.
                                    # Keep this plain ASCII -- Gmail (and some
                                    # other relays) reject unencoded non-ASCII
                                    # characters in a Subject header.
report_top_n: 20                   # how many new suffixes/ASNs to list per section
report_persistent_min_days: 3       # flag anything seen on this many distinct
                                    # days across ALL kept archives (up to 6
                                    # months), even if total volume is tiny --
                                    # catches attackers pacing attempts to
                                    # avoid ranking near the top by volume
report_smtp_host: smtp.example.com
report_smtp_port: 587
report_smtp_user: reports@example.com
report_smtp_pass: CHANGE_ME
report_smtp_starttls: true
report_from: "domainblock@yourhost"
report_to: "you@example.com"

